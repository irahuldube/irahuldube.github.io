<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pf-page-title">Portfolio</title>
<meta name="description" id="pf-page-desc" content="">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔥</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/portfolio-style.css">
</head>
<body>

<canvas id="pf-canvas" aria-hidden="true"></canvas>

<!-- NAV -->
<nav class="nav" id="pf-nav">
  <div class="nav-logo">
    <span id="pf-nav-emoji" class="nav-logo-flame"></span>
    <span id="pf-nav-name"></span>
  </div>
  <div class="nav-links" id="pf-nav-links"></div>
  <button class="nav-hamburger" id="pf-hamburger" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>
</nav>

<!-- HERO -->
<section class="hero" id="home">
  <div class="hero-orb hero-orb-1" aria-hidden="true"></div>
  <div class="hero-orb hero-orb-2" aria-hidden="true"></div>
  <div class="hero-orb hero-orb-3" aria-hidden="true"></div>
  <div class="hero-inner">
    <div class="hero-badge">
      <span class="hero-badge-dot"></span>
      <span id="pf-availability-text"></span>
    </div>
    <h1 class="hero-name" id="pf-hero-name"></h1>
    <div class="hero-typewriter-wrap">
      <span class="hero-tw-prefix" id="pf-tw-prefix"></span>
      <span class="hero-tw-text" id="pf-typewriter"></span>
    </div>
    <p class="hero-sub" id="pf-hero-sub"></p>
    <div class="hero-ctas" id="pf-hero-ctas"></div>
    <div class="hero-stats" id="pf-hero-stats"></div>
  </div>
  <a href="#services" class="scroll-cue" aria-label="Scroll down">
    <span class="scroll-cue-line"></span>
  </a>
</section>

<!-- SERVICES -->
<section id="services" class="section-dark">
  <div class="section-wrap">
    <div class="section-eyebrow" id="pf-svc-eyebrow"></div>
    <h2 class="section-heading" id="pf-svc-heading"></h2>
    <p class="section-sub" id="pf-svc-sub"></p>
    <div class="services-grid" id="pf-services"></div>
  </div>
</section>

<!-- PROJECTS -->
<section id="projects" class="section-darker">
  <div class="section-wrap">
    <div class="section-eyebrow" id="pf-proj-eyebrow"></div>
    <h2 class="section-heading" id="pf-proj-heading"></h2>
    <p class="section-sub" id="pf-proj-sub"></p>
    <div class="filter-row" id="pf-filter-row"></div>
    <div class="projects-grid" id="pf-projects"></div>
  </div>
</section>

<!-- WHY ME -->
<section id="why" class="section-dark">
  <div class="section-wrap section-center">
    <div class="section-eyebrow" id="pf-why-eyebrow"></div>
    <h2 class="section-heading" id="pf-why-heading"></h2>
    <p class="section-sub" id="pf-why-sub"></p>
    <div class="why-grid" id="pf-why-grid"></div>
  </div>
</section>

<!-- PROCESS -->
<section id="process" class="section-darker">
  <div class="section-wrap section-center">
    <div class="section-eyebrow" id="pf-proc-eyebrow"></div>
    <h2 class="section-heading" id="pf-proc-heading"></h2>
    <p class="section-sub" id="pf-proc-sub"></p>
    <div class="process-track" id="pf-process"></div>
  </div>
</section>

<!-- TESTIMONIALS -->
<section id="testimonials" class="section-dark">
  <div class="section-wrap section-center">
    <div class="section-eyebrow" id="pf-test-eyebrow"></div>
    <h2 class="section-heading" id="pf-test-heading"></h2>
    <p class="section-sub" id="pf-test-sub"></p>
    <div class="testimonials-track" id="pf-testimonials"></div>
    <div class="testimonials-nav">
      <button class="tnav-btn" id="pf-tprev" aria-label="Previous">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="testimonials-dots" id="pf-tdots"></div>
      <button class="tnav-btn" id="pf-tnext" aria-label="Next">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>
  </div>
</section>

<!-- CONTACT -->
<section id="contact" class="section-contact">
  <div class="section-wrap section-center">
    <div class="section-eyebrow" id="pf-cont-eyebrow"></div>
    <h2 class="section-heading" id="pf-cont-heading"></h2>
    <p class="section-sub" id="pf-cont-sub"></p>
    <div class="contact-cards" id="pf-contact-cards"></div>
  </div>
</section>

<!-- FOOTER -->
<footer class="footer">
  <div class="footer-left">
    <span class="footer-name" id="pf-footer-name"></span>
    <span class="footer-copy">© <span id="pf-year"></span> · <span id="pf-footer-tagline"></span></span>
  </div>
  <div class="footer-links" id="pf-footer-links"></div>
</footer>

<script src="assets/js/portfolio.js"></script>
</body>
</html>
